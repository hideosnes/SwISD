<!--
1. Relative path: cockpit/src/app.html
2. Description: SvelteKit HTML shell with pre-hydration theme bootstrap (zero flash-of-wrong-regime).
3. Expects: %sveltekit.*% placeholders injected by SvelteKit at render time.
4. Provides: Root document that applies the persisted [data-theme] before first paint.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        var stored = localStorage.getItem('swisd-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored;
        }
      } catch (e) {
        /* Storage unavailable — default regime (dark) applies. */
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
