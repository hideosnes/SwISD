# 1. Relative path: .github/workflows/deploy-site.yml
# 2. Description: GitHub Actions workflow to build and deploy the SwISD marketing site.
# 3. Expects: Hetzner SFTP credentials stored in GitHub Secrets.
# 4. Provides: Automated, secure static asset mirroring to the production web root.

name: Deploy SwISD Site to Hetzner

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./site

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './site/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Site
        run: npm run build

      - name: Deploy via SFTP (lftp)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          script: |
            # Ensure target directory exists
            mkdir -p ${{ secrets.HETZNER_TARGET_DIR }}
            
            # Use lftp to mirror the build directory, deleting obsolete files
            lftp -c "
              set sftp:auto-confirm yes;
              open sftp://${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:${{ secrets.HETZNER_PORT || 22 }};
              login ${{ secrets.HETZNER_USER }} '${{ secrets.HETZNER_PASSWORD }}';
              mirror --reverse --delete --verbose --exclude-glob .git* ./site/build/ ${{ secrets.HETZNER_TARGET_DIR }};
              quit;
            "