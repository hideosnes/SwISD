# 1. Relative path: .github/workflows/release.yml
# 2. Description: GitHub Actions workflow to build, sign, and publish SwISD releases.
# 3. Expects: SWISD_SIGNING_KEY_DER_BASE64 secret configured in the repository.
# 4. Provides: Automated, cryptographically verified release artifacts on tag push.

name: Release & Sign

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases and upload assets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package Release
        run: |
          # Strip 'v' prefix from tag name (e.g., v0.0.2 -> 0.0.2)
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p release-package
          # Package only production-ready files
          cp -r dist package.json package-lock.json release-package/
          tar -czvf "swisd-${VERSION}.tar.gz" -C release-package .

      - name: Sign Release
        env:
          SWISD_SIGNING_KEY_DER_BASE64: ${{ secrets.SWISD_SIGNING_KEY_DER_BASE64 }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npx tsx scripts/sign-release.ts "swisd-${VERSION}.tar.gz"

      - name: Generate SHA-256
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sha256sum "swisd-${VERSION}.tar.gz" | awk '{ print $1 }' > "swisd-${VERSION}.tar.gz.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            swisd-*.tar.gz
            swisd-*.tar.gz.sha256
            swisd-*.tar.gz.sig
          generate_release_notes: true