# 1. Relative path: .github/workflows/release.yml
# 2. Description: GitHub Actions workflow to build, sign, and publish SwISD releases.
# 3. Expects: SWISD_SIGNING_KEY_DER_BASE64 secret configured in the repository.
# 4. Provides: Automated, cryptographically verified release artifacts on tag push or manual dispatch.

name: Release & Sign

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v0.0.10)'
        required: true
        default: 'v0.0.10'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package Release
        run: |
          # Use input tag name for manual, or ref name for tag push, stripping 'v' prefix
          VERSION=${{ github.event.inputs.tag_name || github.ref_name }}
          VERSION=${VERSION#v}
          mkdir -p release-package
          cp -r dist package.json package-lock.json release-package/
          tar -czvf "swisd-${VERSION}.tar.gz" -C release-package .

      - name: Sign Release
        env:
          SWISD_SIGNING_KEY_DER_BASE64: ${{ secrets.SWISD_SIGNING_KEY_DER_BASE64 }}
        run: |
          VERSION=${{ github.event.inputs.tag_name || github.ref_name }}
          VERSION=${VERSION#v}
          npx tsx scripts/sign-release.ts "swisd-${VERSION}.tar.gz"

      - name: Generate SHA-256
        run: |
          VERSION=${{ github.event.inputs.tag_name || github.ref_name }}
          VERSION=${VERSION#v}
          sha256sum "swisd-${VERSION}.tar.gz" | awk '{ print $1 }' > "swisd-${VERSION}.tar.gz.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            swisd-*.tar.gz
            swisd-*.tar.gz.sha256
            swisd-*.tar.gz.sig
          generate_release_notes: true